# Passive raw-RADIO timing observer (nRF52832). The BLE controller must NOT
# own RADIO/PPI/TIMER0.
CONFIG_BT=n
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_GPIO=y
CONFIG_MAIN_STACK_SIZE=4096
# We drive RADIO/TIMER0/PPI directly; keep Zephyr off them.
CONFIG_NRF_RTC_TIMER=y
CONFIG_CLOCK_CONTROL=y
